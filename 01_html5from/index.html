<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html5form</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>입력요소의 종류와 속성</h1>
    <form action="">
    <fieldset>
        <legend>로그인폼</legend>
            <ul>
                <li>
                    <label for="id">아이디:</label>
                    <input type="text" id="id" placeholder="아이디를 입력하세요" autofocus required>
                </li>
                <li>
                    <label for="pw">패스워드:</label>
                    <input type="password" id="pw" placeholder="비밀번호를 입력하세요" required>
                </li>
    </fieldset>
        <input type="submit" value="로그인">
        <!--홈안에 있는 데이터 초기화시-->
        <input type="reset" value="취소">

    <fieldset>
        <legend>나의 개인정보</legend>
            <ul>
                <li>
                    <label for="email">이메일:</label>
                    <input type="email" id="email" placeholder="이메일을 입력하세요" required>
                </li>
                <li>
                    <label for="nationality">국적:</label>
                    <label for="korean">내국인</label>
                    <input type="radio" id="korean" name="nationality" value="korean" required>
                    <label for="foreign">외국인</label>
                    <input type="radio" id="foreign" name="nationality" value="foreign">
                </li>
                <li>
                    <label for="search">search:</label>
                    <input type="text" id="search" placeholder="webdesign" disabled>
                </li>
                <li>
                    <label for="url">URL:</label>
                    <input type="url" id="url" placeholder="https://" required>
                </li>
            </ul>
    </fieldset>
        <input type="submit" value="가입하기">
        <input type="reset" value="새로작성">

    <fieldset>
        <legend>나의 일정</legend>
            <ul>
                <li>
                    <label for="number">숫자 입력:</label>
                    <input type="number" id="number" value="1" min="1" max="10">
                </li>
                <li>
                    <label for="tel">전화번호:</label>
                    <input class="tel" type="tel" id="tel" value="010" disabled>
                    <input class="tel" type="tel" maxlength="4">
                    <input class="tel" type="tel" maxlength="4">
                </li>
                <li>
                    <label for="skill">코딩실력(상중하):</label>
                    <input type="range" id="skill" value="2" min="1" max="3">
                </li>
            </ul>
    </fieldset>
        <input type="submit" value="전송">
        <input type="reset" value="다시작성">

    <fieldset>
        <legend>예약관리</legend>
            <ul>
                <li>
                    <label for="date">예약날짜:</label>
                    <input type="date" id="date">
                </li>
                <li>
                    <label for="time">예약시간:</label>
                    <input type="time" id="time">
                </li>
                <li>
                    <label for="datetime">예약일시:</label>
                    <input type="datetime-local" id="datetime">
                </li>
            </ul>
    </fieldset>
        <input type="submit" value="예약하기">
        <input type="reset" value="취소하기">

    <fieldset>
        <legend>그래프</legend>
            <>
                <li>
                    <label for="color">좋아하는 색상</label>
                    <input type="color" id="color">
                </li>
                <li>
                    <label for="progress">진행률(90%)</label>
                    <input type="range" id="progress" value="90" min="0" max="100">
                </li>
                <li>
                    <label for="progress">사용량(50%)</label>
                    <progress value="50" max="100"></progress>
                    <meter value="50" min="0" max="100"></meter>
                </li>
                <li>
                    <label for="consult">상담문의</label>
                    <select name="select" id="select">
                        <option value="눈성형">눈성형</option>
                        <option value="코성형">코성형</option>
                        <option value="안면윤곽">안면윤곽</option>
                        <option value="지방흡입">지방흡입</option>
                        <option value="리프팅/동안">리프팅/동안</option>
                        <option value="기타">기타</option>
                    </select>
                </li>
            </ul>
    </fieldset>
        <input type="submit" value="가입">
        <input type="reset" value="취소">
    </form>

    <script src="./js/script.js"></script>
</body>
</html>
