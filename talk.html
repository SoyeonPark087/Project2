<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>팬톡</title>

    <style>
        :root {
            --primary: #585fef;
            --violet: #8a63ff;
            --pink: #ff6faf;
            --mint: #34d1bf;

            --background: #060a27;
            --surface: #141a38;
            --card: #070c2b;
            --tabbar: #111938;
            --border: #555b70;

            --white: #ffffff;
            --soft-gray: #dbdce6;
            --muted: #777d95;

            --page-padding: 24px;
            --tabbar-height: 86px;
            --write-area-height: 98px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--background);
            color: var(--white);
            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        input,
        button {
            font: inherit;
        }

        img {
            display: block;
        }

        .fan-talk-page {
            width: 100%;
            min-height: 100svh;
            overflow-y: auto;
            background-color: var(--background);
        }

        .fan-talk-content {
            width: 100%;
            min-height: 100svh;
            padding:
                67px
                var(--page-padding)
                calc(
                    var(--tabbar-height) +
                    var(--write-area-height) +
                    38px +
                    env(safe-area-inset-bottom)
                );
        }

        /* 화면 제목 */
        .page-header {
            width: 100%;
        }

        .page-header__title {
            color: var(--white);
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        /* 팬톡 검색창 */
        .search-form {
            position: relative;
            width: 100%;
            height: 51px;
            margin-top: 22px;
        }

        .search-form__icon {
            position: absolute;
            top: 50%;
            left: 18px;
            z-index: 2;
            width: 21px;
            height: 21px;
            object-fit: contain;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .search-form__input {
            display: block;
            width: 100%;
            height: 51px;
            padding: 0 18px 0 49px;

            border: 1px solid #555b70;
            border-radius: 14px;
            outline: none;

            background-color: #242942;
            color: var(--white);

            font-size: 15px;
            font-weight: 400;
            line-height: 51px;
            letter-spacing: -0.35px;
        }

        .search-form__input::placeholder {
            color: #d0d2dc;
            opacity: 1;
        }

        .search-form__input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 2px rgba(138, 99, 255, 0.14);
        }

        .search-form__input::-webkit-search-cancel-button {
            display: none;
        }

        /* 게시글 유형 탭 */
        .category-tabs {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 23px;
        }

        .category-tabs__item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 34px;
            border-radius: 999px;

            color: var(--soft-gray);
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
        }

        .category-tabs__item--active {
            background:
                linear-gradient(
                    100deg,
                    var(--primary) 0%,
                    var(--violet) 100%
                );
            color: var(--white);
        }

        /* 게시글 목록 */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 23px;
        }

        .post-card {
            position: relative;
            width: 100%;
            min-height: 166px;
            padding: 16px 50px 15px 15px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background-color: var(--card);
        }

        .post-card--compact {
            min-height: 148px;
        }

        .post-card__header {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .post-card__profile {
            flex-shrink: 0;
            width: 45px;
            height: 45px;
            overflow: hidden;
            border-radius: 50%;
            background-color: #20284b;
        }

        .post-card__profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .post-card__author-area {
            min-width: 0;
            margin-left: 15px;
        }

        .post-card__author {
            overflow: hidden;
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.3px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .post-card__time {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 400;
            line-height: 1;
        }

        .post-card__menu {
            position: absolute;
            top: 18px;
            right: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 44px;
        }

        .post-card__menu-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .post-card__body {
            margin-top: 13px;
        }

        .post-card__text {
            color: var(--white);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.45;
            letter-spacing: -0.45px;
            word-break: keep-all;
        }

        .post-card__reactions {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 14px;
        }

        .reaction {
            display: flex;
            align-items: center;
            min-height: 24px;
            color: var(--white);
            font-size: 12px;
            font-weight: 500;
            line-height: 1;
        }

        .reaction__icon {
            width: 19px;
            height: 19px;
            margin-right: 5px;
            object-fit: contain;
        }

        .post-card__tag {
            display: flex;
            align-items: center;
            justify-content: center;

            width: fit-content;
            height: 23px;
            margin-top: 14px;
            padding: 0 11px;

            border-radius: 999px;
            background-color: var(--mint);
            color: var(--white);

            font-size: 11px;
            font-weight: 700;
            line-height: 1;
        }

        /* 글쓰기 버튼 고정 영역 */
        .write-area {
            position: fixed;
            right: 0;
            bottom:
                calc(
                    var(--tabbar-height) +
                    env(safe-area-inset-bottom)
                );
            left: 0;
            z-index: 90;

            display: flex;
            align-items: flex-end;

            width: 100%;
            height: var(--write-area-height);
            padding: 14px var(--page-padding) 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(6, 10, 39, 0) 0%,
                    rgba(6, 10, 39, 0.95) 24%,
                    var(--background) 52%,
                    var(--background) 100%
                );
        }

        .write-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 56px;
            border-radius: 14px;

            background:
                linear-gradient(
                    100deg,
                    var(--primary) 0%,
                    var(--violet) 58%,
                    var(--pink) 100%
                );

            color: var(--white);
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
        }

        .write-button:active {
            opacity: 0.84;
        }

        /* 공통 하단 탭바 */
        .tabbar {
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;

            width: 100%;
            height:
                calc(
                    var(--tabbar-height) +
                    env(safe-area-inset-bottom)
                );

            padding:
                8px
                20px
                env(safe-area-inset-bottom);

            border-top: 1px solid #4c5268;
            border-radius: 16px 16px 0 0;
            background-color: var(--tabbar);
        }

        .tabbar__list {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            list-style: none;
        }

        .tabbar__item {
            flex: 1;
            min-width: 0;
        }

        .tabbar__link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
            color: var(--soft-gray);
        }

        .tabbar__icon {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .tabbar__label {
            margin-top: 6px;
            color: var(--soft-gray);
            font-size: 12px;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
        }

        .tabbar__link--active .tabbar__label {
            color: var(--violet);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="fan-talk-page">

        <main class="fan-talk-content">

            <!-- 화면 제목 -->
            <header class="page-header">
                <h1 class="page-header__title">팬톡</h1>
            </header>

            <!-- 팬톡 검색 -->
            <form
                class="search-form"
                action="./fan-talk-search.html"
                method="get"
            >
                <img
                    class="search-form__icon"
                    src="./Icons/search-2.svg"
                    alt=""
                >

                <input
                    class="search-form__input"
                    type="search"
                    name="keyword"
                    placeholder="공연명 또는 팬톡 검색"
                    aria-label="공연명 또는 팬톡 검색"
                >
            </form>

            <!-- 팬톡 카테고리 -->
            <nav
                class="category-tabs"
                aria-label="팬톡 유형"
            >
                <a
                    class="category-tabs__item category-tabs__item--active"
                    href="./fan-talk.html"
                    aria-current="page"
                >
                    인기
                </a>

                <a
                    class="category-tabs__item"
                    href="./fan-talk-companion.html"
                >
                    동행
                </a>

                <a
                    class="category-tabs__item"
                    href="./fan-talk-information.html"
                >
                    정보
                </a>
            </nav>

            <!-- 팬톡 게시글 목록 -->
            <section class="post-list" aria-label="팬톡 게시글">

                <!-- 게시글 1 -->
                <article class="post-card">
                    <header class="post-card__header">
                        <div class="post-card__profile">
                            <img
                                class="post-card__profile-image"
                                src="./Images/profile1.png"
                                alt="Forever_123 프로필"
                            >
                        </div>

                        <div class="post-card__author-area">
                            <h2 class="post-card__author">
                                Forever_123
                            </h2>

                            <p class="post-card__time">
                                5분전
                            </p>
                        </div>
                    </header>

                    <a
                        class="post-card__menu"
                        href="./fan-talk-post-menu.html"
                        aria-label="Forever_123 게시글 메뉴"
                    >
                        <img
                            class="post-card__menu-icon"
                            src="./Icons/more.svg"
                            alt=""
                        >
                    </a>

                    <a
                        class="post-card__body"
                        href="./fan-talk-detail.html"
                    >
                        <p class="post-card__text">
                            최고의 무대였어요! 💛<br>
                            다음 공연도 함께 해요!
                        </p>

                        <div class="post-card__reactions">
                            <span class="reaction">
                                <img
                                    class="reaction__icon"
                                    src="./Icons/like.svg"
                                    alt=""
                                >
                                128
                            </span>

                            <span class="reaction">
                                <img
                                    class="reaction__icon"
                                    src="./Icons/comment.svg"
                                    alt=""
                                >
                                24
                            </span>
                        </div>
                    </a>
                </article>

                <!-- 게시글 2 -->
                <article class="post-card post-card--compact">
                    <header class="post-card__header">
                        <div class="post-card__profile">
                            <img
                                class="post-card__profile-image"
                                src="./Images/profile2.png"
                                alt="요플레이 프로필"
                            >
                        </div>

                        <div class="post-card__author-area">
                            <h2 class="post-card__author">
                                요플레이
                            </h2>

                            <p class="post-card__time">
                                2시간 전
                            </p>
                        </div>
                    </header>

                    <a
                        class="post-card__menu"
                        href="./fan-talk-post-menu.html"
                        aria-label="요플레이 게시글 메뉴"
                    >
                        <img
                            class="post-card__menu-icon"
                            src="./Icons/more.svg"
                            alt=""
                        >
                    </a>

                    <a
                        class="post-card__body"
                        href="./fan-talk-detail.html"
                    >
                        <p class="post-card__text">
                            CON:NECT 공연 같이 입장할 분 구해요
                        </p>

                        <span class="post-card__tag">
                            동행
                        </span>
                    </a>
                </article>

            </section>

        </main>

        <!-- 글쓰기 버튼 -->
        <div class="write-area">
            <a
                class="write-button"
                href="./fan-talk-write.html"
            >
                글쓰기
            </a>
        </div>

        <!-- 공통 하단 탭바 -->
        <nav class="tabbar" aria-label="주요 메뉴">
            <ul class="tabbar__list">

                <li class="tabbar__item">
                    <a
                        class="tabbar__link"
                        href="./home.html"
                    >
                        <img
                            class="tabbar__icon"
                            src="./Icons/home-2.svg"
                            alt=""
                        >
                        <span class="tabbar__label">홈</span>
                    </a>
                </li>

                <li class="tabbar__item">
                    <a
                        class="tabbar__link"
                        href="./search1.html"
                    >
                        <img
                            class="tabbar__icon"
                            src="./Icons/search-2.svg"
                            alt=""
                        >
                        <span class="tabbar__label">탐색</span>
                    </a>
                </li>

                <li class="tabbar__item">
                    <a
                        class="tabbar__link"
                        href="./event1.html"
                    >
                        <img
                            class="tabbar__icon"
                            src="./Icons/bookmark-2.svg"
                            alt=""
                        >
                        <span class="tabbar__label">내 공연</span>
                    </a>
                </li>

                <li class="tabbar__item">
                    <a
                        class="tabbar__link tabbar__link--active"
                        href="./talk.html"
                        aria-current="page"
                    >
                        <img
                            class="tabbar__icon"
                            src="./Icons/message-1.svg"
                            alt=""
                        >
                        <span class="tabbar__label">팬톡</span>
                    </a>
                </li>

                <li class="tabbar__item">
                    <a
                        class="tabbar__link"
                        href="./my.html"
                    >
                        <img
                            class="tabbar__icon"
                            src="./Icons/user-2.svg"
                            alt=""
                        >
                        <span class="tabbar__label">마이</span>
                    </a>
                </li>

            </ul>
        </nav>

    </div>
</body>
</html>
